<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaTeX / Markdown 实时编辑器</title>
    
    <!-- 1. 样式表 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
    
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
        header { 
            height: 45px; background: #24292e; color: white; 
            display: flex; align-items: center; padding: 0 20px; 
            justify-content: space-between; font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .status { color: #8b949e; font-size: 12px; }
        .main-container { display: flex; height: calc(100% - 45px); }
        #editor { 
            flex: 1; height: 100%; padding: 20px; border: none; 
            border-right: 1px solid #ddd; resize: none; outline: none; 
            font-family: 'Fira Code', 'Consolas', monospace; font-size: 15px; 
            line-height: 1.6; background: #fdfdfd; color: #333;
        }
        #preview-container { flex: 1; height: 100%; padding: 20px; overflow-y: auto; background: white; }
    </style>
</head>
<body>

<header>
    <div><strong>Eason's LaTeX Editor</strong></div>
    <div class="status" id="status">在线就绪</div>
</header>

<div class="main-container">
    <textarea id="editor" placeholder="在此输入 Markdown 或 LaTeX..."></textarea>
    <div id="preview-container">
        <div id="preview" class="markdown-body"></div>
    </div>
</div>

<!-- 2. 脚本库 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');

    // 默认展示的内容
    const defaultText = "# 在线编辑器已准备就绪\n\n你可以开始输入了。支持矩阵换行：\n\n$$\n\\begin{pmatrix}\na & b \\\\\nc & d\n\\end{pmatrix}\n$$\n\n试试输入常用的算法公式吧！";

    // 渲染逻辑
    function render() {
        let text = editor.value;
        const mathStore = [];
        
        // 保护多行公式
        text = text.replace(/\$\$([\s\S]*?)\$\$/g, (match) => {
            mathStore.push(match);
            return `\n\n@@MATH_BLOCK_${mathStore.length - 1}@@\n\n`;
        });
        
        // 保护单行公式
        text = text.replace(/\$([^$\n]+?)\$/g, (match) => {
            mathStore.push(match);
            return `@@MATH_INLINE_${mathStore.length - 1}@@`;
        });

        let html = marked.parse(text);

        // 还原公式
        html = html.replace(/<p>@@MATH_BLOCK_(\d+)@@<\/p>/g, (match, i) => mathStore[i]);
        html = html.replace(/@@MATH_BLOCK_(\d+)@@/g, (match, i) => mathStore[i]);
        html = html.replace(/@@MATH_INLINE_(\d+)@@/g, (match, i) => mathStore[i]);

        preview.innerHTML = html;

        // 触发 KaTeX
        renderMathInElement(preview, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ],
            throwOnError: false
        });
    }

    // 监听输入并更新状态
    let debounceTimer;
    editor.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            render();
            status.innerText = "最后渲染时间: " + new Date().toLocaleTimeString();
        }, 300);
    });

    // 初始化页面
    window.onload = () => {
        editor.value = defaultText;
        render();
    };

    // Tab 键支持
    editor.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = this.selectionStart;
            this.value = this.value.substring(0, start) + "    " + this.value.substring(this.selectionEnd);
            this.selectionStart = this.selectionEnd = start + 4;
        }
    });
</script>

</body>
</html>
